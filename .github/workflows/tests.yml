name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Schedule panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/frontend.test.cjs
  pytest:
    name: Pytest (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2026.2.3"
            pytest-ha: "0.13.316"
          - python: "3.14"
            homeassistant: "2026.9.3"
            pytest-ha: "0.13.366"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements_test.txt "homeassistant==${{ matrix.homeassistant }}" "pytest-homeassistant-custom-component==${{ matrix.pytest-ha }}"
      - name: Run tests
        run: pytest --tb=short
      - name: Check Python names and imports
        run: python -m pyflakes custom_components/vesta tests
